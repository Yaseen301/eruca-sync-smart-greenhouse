name: Import Eruca Sync source materials

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-eruca-sync.yml']

permissions:
  contents: write

concurrency:
  group: eruca-source-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMPORT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Copy pinned upstream files and verify original hashes
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main "https://github.com/${GITHUB_REPOSITORY}.git" target
          git -C target config core.autocrlf false
          git clone --no-checkout https://github.com/Nadoooor/Eruca-Sync.git source
          git -C source checkout --detach 49f52b0db70bf52fc38d7b9a41fe47a303049562
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          source = pathlib.Path("source")
          target = pathlib.Path("target")
          expected = json.loads("{\"3D design/3D.step\":\"bd2c0804cf8e8e134ece767bb2d9991d53fa75d2\",\"BOM.csv\":\"8beaa38bc69d5c4fc7be692e08d4188f9163c5ea\",\"BOM.md\":\"57342c7ec881b2b26ab252c8ecbcef75e1f9c3a7\",\"Docs/Build-photos/column_nail_head_mod.png\":\"904c13be39978c113b272ccf165d8a12fde16a36\",\"Docs/Build-photos/connecting circuit for the first time.jpg\":\"5f73c6e1f3dbb5711021f23eefa8956f2fc76e3c\",\"Docs/Build-photos/connecting the circuit in the structure.jpg\":\"5815f5029af96d7e9d13d98ea63e5f0e85f7532b\",\"Docs/Build-photos/connecting wooden pieces with MDF.jpg\":\"a9a480ebd8f8623b8612c23d9b0a48bc5d6b9420\",\"Docs/Build-photos/control_panel_screen_active.png\":\"ffc763362a9cb4ffd87b598da30e6b92cad4c8f6\",\"Docs/Build-photos/cutting plastic sheet.jpg\":\"5906dd37cdd8de00a6ee6817f870ef2c0d702867\",\"Docs/Build-photos/desk_top_base.png\":\"fc6876d63e94d524b5666fbc03e47d6ae08d6b14\",\"Docs/Build-photos/dismantling_drawers.png\":\"67300db45320c4bbad79ba192b41a6664057080c\",\"Docs/Build-photos/drawer_columns_broken.png\":\"10de3363ae6cf5f54938125dd3167d03df87efb2\",\"Docs/Build-photos/drawer_elevation_blocks.png\":\"5c2f24b46c79d12b71c1089c100a0cf8f19b2b52\",\"Docs/Build-photos/dried sand.jpg\":\"9448446caacb6647f5c1d5e6a5c12ff7bf751a61\",\"Docs/Build-photos/dual_breadboard_circuit.png\":\"6e740c0b879c69834cf66c04b6a4623c731dfefd\",\"Docs/Build-photos/filling the planting box with soil.jpg\":\"4405d0c48af73f8b8ff2053e51f08c9a16aec6b7\",\"Docs/Build-photos/final look with arugula seedlings.jpg\":\"6ca7521c5de7fe18ebad338e75301ddbe0d3878c\",\"Docs/Build-photos/final_greenhouse_prototype.png\":\"72bd611a72c5924be7f7607a1a9bfb43d48e1f12\",\"Docs/Build-photos/gluing_greenhouse_sheets.png\":\"aefe9d2cae3dfb63fcbfac804a513a7d08901827\",\"Docs/Build-photos/marking the holes on the plastic tube.jpg\":\"aae5957bc7ea09db5e772e4327bee6dd3cdde2df\",\"Docs/Build-photos/measuring length.jpg\":\"0935fb75513ecbd5d0fe7de2ceefc783f5520e81\",\"Docs/Build-photos/measuring widt