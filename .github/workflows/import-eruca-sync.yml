/.vscode/extensions.json\":\"080e70d08b9811fa743afe5094658dba0ed6b7c2\",\"Firmware/include/README\":\"49819c0d54960b5848277cc68ab2d08169cecaf3\",\"Firmware/lib/README\":\"93793971ffcaedf70668ba0d17d84315c350f9f7\",\"Firmware/platformio.ini\":\"fe04042174c3b489414216cbf3173b515611fdf8\",\"Firmware/src/main.cpp\":\"81cc9aeedcb9be44eb9a198f9366b85970fb041b\",\"Firmware/test/README\":\"9b1e87bc67c90e7f09a92a3e855444b085c655a6\",\"LICENSE\":\"bb9582c40f2d81971b881259a879517eecd425a8\",\"PCB/Cap S2.kicad_pcb\":\"0698b7aa3ff906cbfbf85417596480bfee213911\",\"PCB/Cap S2.kicad_prl\":\"4622e5fa05f4f16cb5d934998177d6f3efea9a48\",\"PCB/Cap S2.kicad_pro\":\"91eeb8f35917a05f8b710157db1da70c3488ecb5\",\"PCB/Cap S2.kicad_sch\":\"104f5889bec88da150af92e3d7921c2b801ab772\",\"PCB/Cap S2.step\":\"7965c09a8fbe930e9e22363dfdcd9e513d71de2e\",\"PCB/ESP32-S3.kicad_sch\":\"1759e4edc2fe12791e10b4aa82c5b28a91501ac0\",\"PCB/MCUs.pretty/ESP32-S3-DEVKITC-1.kicad_mod\":\"67286f85ddb0616e5fb546e1f4ac0457513c2687\",\"PCB/MCUs.pretty/MOSFET_KIT.kicad_mod\":\"b9b7e3606f356322e43d15f7f6e31f4354c41847\",\"PCB/PCB_3D.step\":\"0f459f05d29a833c0d6810a569972c2d7b6a8abf\",\"PCB/Power_Management.kicad_sch\":\"a538109e83f159174947643bf0015e54272ac032\",\"PCB/Power_Sources.kicad_sch\":\"9b492178b28430b78a8b6deb3250ad5045c4edbe\",\"PCB/RAM.pretty/TFT_SCREEN.kicad_mod\":\"0c1eed8874581b36a16a4a209caae8e32f248702\",\"PCB/Sensors.kicad_sch\":\"24c364fc2ebadb545959e73b45cf0756eb07ce47\",\"PCB/TFT_Touch_Screen.kicad_sch\":\"1742319e6c2ca5c27b3f28db954c0bf5e63bf6eb\",\"PCB/actruators.kicad_sch\":\"f5a2c3e5639801fbbf90b25340e965f8d5a545ce\",\"PCB/fabrication-toolkit-options.json\":\"fb33be0c0bf02ff1a14edc64cd993db5a9730090\",\"PCB/fp-info-cache\":\"ac136e86d4a947d345388ec8e1421eecf8687955\",\"PCB/fp-lib-table\":\"213062027435e19e5138eee4be2e4083b8c67ebf\",\"Photos/3d PCB.png\":\"cc674a5c45a45b4abaef9f2c42e50f6c11aaf739\",\"Photos/COOL.png\":\"0ec0453a8812676efc264b9a5bfae25b8d8fc526\",\"Photos/Erucazine.png\":\"807d1e3d07c3b05cc69cf2e37a7154e0cd1781da\",\"Photos/FINAL-f.png\":\"0e5b2b5c259275472d25f6fe7b3cf629d47476b4\",\"Photos/FINAL_b.png\":\"48ea516605f4f612c232988659c90560f9c4215b\",\"Photos/FINAL_fPC.png\":\"af28a579624a0b05114ec1d1780f9a83b064680f\",\"Photos/Hope.png\":\"5f222126da129167f0870a16389bf9ea56bedd2e\",\"Photos/PCB.png\":\"f4206cd6ac39520a319ad458783d13472c679412\",\"Photos/Schematic.png\":\"fa68707a5de8b06863a0d4940493a9ddf394e37b\",\"Photos/leaf.png\":\"6db0defc387978d48af86db20f75682d005af37c\",\"Photos/leaf2.png\":\"193f2c73b30324800a26875aeddf94451afed264\",\"Photos/leaf3.png\":\"b1c8007a96a1164365a1e3dac1924943c2ed4e8b\",\"Photos/product-description.png\":\"2686a339cc6fa7ffa2adf8965a94e68eed36b75e\",\"Photos/star.png\":\"b1767ab76ac5eb06121f95b0674cbb5b0e56c839\",\"Production/3D design/3D.step\":\"bd2c0804cf8e8e134ece767bb2d9991d53fa75d2\",\"Production/3D design/Onshape document.txt\":\"440a878540fad39531e812b92854ddbda8b49c76\",\"Production/PCB/FInal_fabrication.zip\":\"8798b49257fa2a02e61df07981c903daf073b8e9\",\"Production/PCB/FInal_fabrication_bom.csv\":\"a2245770111b06cccf9f0c03add207034bd9a3ad\",\"Production/PCB/FInal_fabrication_designators.csv\":\"09cc33eafbfecbfd99232d5c7b3354344fa0370c\",\"Production/PCB/FInal_fabrication_positions.csv\":\"eb4bbbc74eefeb631231850bdcdc48f2c3c184d0\",\"Production/PCB/backups/FInal_fabrication_2026-05-18_13-11-32.zip\":\"a460ed7de7d1354802745d69621a9799f0fd9c59\",\"Production/PCB/netlist.ipc\":\"06f601b2fc019c64f2204fe617d96a73bccf38f0\",\"Production/Ready_firmware/firmware.bin\":\"be4e55b3976502244646fae69219901ecb4d73cf\",\"Production/Ready_firmware/firmware.elf\":\"50f1f30ce67377947356e230c6e01879d09ced85\",\"README.md\":\"852fb6fbcfe0d373ef98154525d7d9425ea21497\"}")
          docs = json.loads("{\"README.md\":\"# Eruca Sync Smart Greenhouse\\n\\nAn automated greenhouse prototype that uses environmental sensing and feedback control to protect crops from changing growing conditions.\\n\\n**STEM capstone | Team 10206 | 2025-2026 Second semester**\\n\\n## Egypt grand challenges\\n\\nReducing the effects of climate change on agriculture and improving the use of arid areas.\\n\\n## Prototype\\n\\nAn ESP32-S3 monitors temperature, soil moisture, and light intensity and controls actuators to maintain suitable growing conditions.\\n\\n![Prototype design preview](prototype-design-1.jpeg)\\n\\n## Project materials\\n\\n| Material | File |\\n| --- | --- |\\n| Portfolio | [Research portfolio](portfolio.docx) |\\n| Poster | [Full-size poster](poster-fullsize.pdf) |\\n| Prototype design | [Design illustrations and editable models](DESIGN.md) |\\n| Firmware | [Source and build instructions](Firmware/README.md) |\\n| Editable 3D model | [Greenhouse STEP model](3D%20design/3D.step) |\\n| Circuit design | [KiCad PCB and schematic files](PCB/) |\\n| Fabrication and binaries | [Production files](Production/) |\\n| Bill of materials | [Readable BOM](BOM.md) · [CSV](BOM.csv) |\\n| Build documentation | [Build journal](Docs/Build_Journal.md) · [Photos](Docs/Build-photos/) |\\n| Original implementation guide | [Upstream README](README-UPSTREAM.md) |\\n\\n## Research context\\n\\nThis repository presents a student team research project. The portfolio contains the project background, design reasoning, methods, and reported findings. Prototype results are reported in their original educational context.\\n\\n## Design and reported results\\n\\n- Designed for leafy crops in Siwa Oasis, with ESP32-S3 feedback control of temperature, light, and soil moisture.\\n- Used Peltier heating and cooling, drip irrigation, and a servo-driven light-filter curtain.\\n- Calibrated all three sensors and built the frame mostly from recycled wood.\\n- Operated automatically for six hours and logged outdoor data across five consecutive days.\\n- Worst-case recovery: 27.5 minutes, within the 30-minute design limit.\\n- Final grade: A.\\n\\nThe results and distinctions above are reported in the project portfolio and the application CV.\\n\\n## Attribution\\n\\nThis project was developed collaboratively by the team credited in the portfolio. This repository is maintained by [Yaseen301](https://github.com/Yaseen301). Team authorship and source references remain in the original documents.\\n\\n## Implementation source and credits\\n\\nThe firmware, CAD models, circuit designs, fabrication files, bill of materials, build photos, and implementation documentation were imported from [Nader Sayed (Nadoooor)'s Eruca-Sync repository](https://github.com/Nadoooor/Eruca-Sync/tree/49f52b0db70bf52fc38d7b9a41fe47a303049562). The original implementation is retained unchanged, including its [MIT license and copyright notice](LICENSE) and [asset credits](Docs/Credits.md).\\n\\nThe first-person descriptions in [README-UPSTREAM.md](README-UPSTREAM.md) refer to the upstream author. See [IMPORT-NOTES.md](IMPORT-NOTES.md) for the import scope and provenance. The team research portfolio and poster remain credited to their original authors.\\n\",\"DESIGN.md\":\"# Prototype design\\n\\n## Editable CAD and circuit files\\n\\n- [Greenhouse STEP model](3D%20design/3D.step)\\n- [Production STEP model and Onshape document link](Production/3D%20design/)\\n- [KiCad PCB project, schematics, footprints, and PCB STEP models](PCB/)\\n- [PCB fabrication outputs](Production/PCB/)\\n\\nThese files were imported unchanged from [Nadoooor/Eruca-Sync](https://github.com/Nadoooor/Eruca-Sync/tree/49f52b0db70bf52fc38d7b9a41fe47a303049562). See [IMPORT-NOTES.md](IMPORT-NOTES.md) for credits and license details.\\n\\n## Portfolio illustrations\\n\\nThese illustrations were extracted without alteration from the supplied research portfolio.\\n\\n![Prototype design illustration 1](prototype-design-1.jpeg)\\n\\n![Prototype design illustration 2](prototype-design-2.png)\\n\",\"IMPORT-NOTES.md\":\"# Imported implementation materials\\n\\nSource: [Nadoooor/Eruca-Sync](https://github.com/Nadoooor/Eruca-Sync)\\n\\nPinned source revision: `49f52b0db70bf52fc38d7b9a41fe47a303049562`.\\n\\nOriginal implementation author and copyright holder: Nader Sayed. The imported materials retain the upstream [MIT license](LICENSE) and [third-party asset credits](Docs/Credits.md).\\n\\n## Scope\\n\\nAll 94 files from the pinned source revision are included. The upstream root README is preserved as [README-UPSTREAM.md](README-UPSTREAM.md), so the existing research overview remains the main README. Original relative paths are retained for the other source files, including archival documents and fabrication backups.\\n\\nThe import includes PlatformIO firmware source and configuration, compiled firmware binaries, editable STEP models, KiCad projects and footprints, fabrication outputs, bills of materials, build photos, and documentation.\\n\\nExisting portfolio, poster, and extracted prototype illustrations are retained. Their authorship remains with the team credited in those documents; importing an MIT-licensed implementation does not by itself relicense those separate research materials.\\n\\n## Verification and use\\n\\nImported file contents are checked against their upstream Git blob hashes. The imported source code and prebuilt binaries have not been modified, rebuilt, flashed, or tested on hardware during this import. The additional [firmware guide](Firmware/README.md) explains where the source, configuration, and prebuilt artifacts are located.\\n\",\"Firmware/README.md\":\"# Eruca Sync firmware\\n\\nThe source in [src/main.cpp](src/main.cpp) and [platformio.ini](platformio.ini) is imported unchanged from Nader Sayed's [Eruca-Sync repository](https://github.com/Nadoooor/Eruca-Sync/tree/49f52b0db70bf52fc38d7b9a41fe47a303049562). See the root [MIT license](../LICENSE) and [import notes](../IMPORT-NOTES.md).\\n\\n## Build and upload\\n\\nOpen this `Firmware` folder as the PlatformIO project in VS Code. The configuration selects the Arduino framework and environment `esp32-s3-devkitc1-n16r8`.\\n\\nFrom the repository root, with PlatformIO installed:\\n\\n```sh\\npio run -d Firmware\\npio run -d Firmware -t upload\\npio device monitor -d Firmware -b 115200\\n```\\n\\nThe configuration declares TFT_eSPI, Adafruit TouchScreen, BH1750, ESP32Servo, Adafruit NeoPixel, and the Adafruit AM2320 sensor library.\\n\\n## Hardware configuration to review\\n\\nThe imported source assigns GPIO 17 to both `FAN2_pin` and `ServoR_pin`. Confirm the actual wiring and resolve that overlap before flashing a device. Check that the selected board definition and TFT_eSPI display setup match the ESP32-S3 board and screen; no custom board definition or explicit TFT_eSPI setup file is supplied in the imported project.\\n\\n## Supplied binaries\\n\\nThe upstream prebuilt [firmware.bin](../Production/Ready_firmware/firmware.bin) and [firmware.elf](../Production/Ready_firmware/firmware.elf) are retained as supplied. Their build environment and correspondence to a new local build have not been verified. No hardware testing was performed during this import.\\n\"}")
          for path, expected_sha in expected.items():
              src = source / path
              data = src.read_bytes()
              actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if actual != expected_sha:
                  raise RuntimeError("Source hash mismatch: " + path)
              destination = target / ("README-UPSTREAM.md" if path == "README.md" else path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, destination)
          for path, text in docs.items():
              destination = target / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(text.encode("utf-8"))
          subprocess.run(["git", "-C", str(target), "add", "--all"], check=True)
          for path, expected_sha in expected.items():
              destination = "README-UPSTREAM.md" if path == "README.md" else path
              actual = subprocess.check_output(["git", "-C", str(target), "rev-parse", ":" + destination], text=True).strip()
              if actual != expected_sha:
                  raise RuntimeError("Staged hash mismatch: " + destination)
          # The existing binary research materials must remain unchanged.
          for path in ("portfolio.docx", "poster-fullsize.pdf", "prototype-design-1.jpeg", "prototype-design-2.png"):
              subprocess.run(["git", "-C", str(target), "diff", "--cached", "--exit-code", "--", path], check=True)
          print("Verified all", len(expected), "imported files; existing research materials preserved.")
          
          PY
          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git -C target diff --cached --quiet; then
            echo "Source materials are already synchronized."
            exit 0
          fi
          git -C target commit -m "Import Eruca Sync firmware, CAD, PCB, and build materials with original credits"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$IMPORT_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_HEADER"
          git -C target -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:main
          
